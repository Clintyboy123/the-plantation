# Frontend Nginx: serves the built React app and forwards /api/* to the backend container.
# The VPS-level Nginx (HTTPS, domain) sits in front of this and is NOT configured here.

# Pass the visitor's original protocol (https) through to the API; fall back to ours when run directly.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's internal DNS. Together with the variable in proxy_pass below, Nginx looks the
    # backend up again while running, so the site keeps working after the backend container
    # is rebuilt and gets a new internal address (otherwise: 502 until the frontend restarts).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Largest request body accepted (raise for file uploads, and match it in the backend).
    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers for the pages themselves. (Helmet only covers API responses.)
    # Nginx drops these inside any location that has its own add_header, so they are repeated there.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- API -----------------------------------------------------------------
    # Port 3000 must match BACKEND_PORT in .env. It is internal to this site's
    # Docker network, so it never clashes with other sites on the VPS.
    location /api/ {
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # /api with no trailing slash is not a page; never hand it to the React app.
    location = /api {
        return 404;
    }

    # --- Static files --------------------------------------------------------
    # Vite gives built files a unique hash in their name, so they can be cached for a long time.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Venue photographs and brand files: not fingerprinted, but they change rarely. Cache for 30 days.
    # A missing photo is a real 404, never the React app.
    location ~ ^/(photos|brand)/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # index.html must never be cached, or visitors keep an old version after a redeploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # --- React Router ----------------------------------------------------------
    # Any other address is a page inside the React app: serve index.html and let the router decide.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
